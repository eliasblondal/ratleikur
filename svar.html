<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svarblað · Silfur Ketils hængs</title>
<link rel="stylesheet" href="css/fonts.css?v=1794653795">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #2a1d12; }
  .toolbar { position: sticky; top: 0; display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #1a120b; color: #f0dfb5; font: 15px Alegreya, Georgia, serif; }
  .toolbar a { color: #f0dfb5; }
  .toolbar button { font: inherit; font-weight: 700; padding: 8px 14px; border: 0; border-radius: 6px; background: #e9c56c; color: #24160a; cursor: pointer; }
  @media print { .toolbar { display: none; } html, body { background: #fff; } .page { margin: 0 !important; box-shadow: none !important; } }
  .page { width: 210mm; height: 297mm; margin: 20px auto; padding: 9mm 10mm 8mm; background: #fff; color: #111; overflow: hidden;
    font-family: Alegreya, Runic, Georgia, serif; font-weight: 500; font-size: 8.6pt; line-height: 1.22; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  h1 { margin: 0; font: 700 15pt 'Fell SC', Georgia, serif; color: #7a1d10; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font: 600 8.6pt Alegreya, Georgia, serif; color: #111; }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6mm 5mm; margin: 1.6mm 0 2mm; padding: 1.6mm 2.4mm; border: .35mm solid #111; border-radius: 1.5mm; }
  .top b { color: #7a1d10; }
  h2 { margin: 2.2mm 0 1mm; font: 700 11pt 'Fell SC', Georgia, serif; color: #fff; background: #3a2614; padding: .8mm 2.4mm; border-radius: 1mm; display: flex; justify-content: space-between; }
  h2.r { background: #1f3d63; }
  h2 span { font: 600 8.4pt Alegreya, Georgia, serif; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { text-align: left; font-weight: 800; border-bottom: .4mm solid #111; padding: .5mm 1.2mm; }
  td { vertical-align: top; padding: .7mm 1.2mm; border-bottom: .2mm solid #555; }
  tr:nth-child(even) td { background: #f3ede0; }
  col.n { width: 5mm; } col.s { width: 27mm; } col.a { width: 57mm; }
  td.n { font-weight: 800; }
  td.s b { display: block; }
  .ans { font-weight: 800; color: #7a1d10; }
  .ans.big { font-size: 10pt; }
  .code { font: 800 10pt Alegreya, Georgia, serif; letter-spacing: .08em; }
  .fin { margin-top: 2mm; padding: 1.6mm 2.4mm; border: .35mm solid #7a1d10; border-radius: 1.5mm; }
  .fin b { color: #7a1d10; }
  .mo { margin-top: 2mm; padding: 1.4mm 2.4mm; border: .35mm solid #1f3d63; border-radius: 1.5mm; }
  .mo b { color: #1f3d63; }
  .mo ol { margin: .6mm 0 0; padding-left: 4.5mm; }
  .mo li { margin: .3mm 0; }
  .foot { margin-top: 1.6mm; font-size: 7.8pt; }
</style>
</head>
<body>
<div class="toolbar"><a href="./#/hq">‹ Til baka</a><button onclick="window.print()">🖨️ Prenta</button><span>Svarblað fyrir fullorðna · ein A4 síða</span></div>
<div class="page" id="p"></div>
<script src="js/data.js?v=1794653795"></script>
<script>
(function () {
  const D = window.RATLEIKUR;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('ratleikur.settings') || '{}'); } catch (e) { }
  const S = Object.assign({}, D.defaults, saved);
  const L = String(S.lockCode).split('');
  const W = d => D.numberWords[+d];
  const w = d => W(d).charAt(0) + W(d).slice(1).toLowerCase();
  const ALPHA = ['A', 'Á', 'B', 'D', 'Ð', 'E', 'É', 'F', 'G', 'H', 'I', 'Í', 'J', 'K', 'L', 'M', 'N', 'O', 'Ó', 'P', 'R', 'S', 'T', 'U', 'Ú', 'V', 'X', 'Y', 'Ý', 'Þ', 'Æ', 'Ö'];
  const CAESAR = (t, k) => [...t.toUpperCase()].map(c => { const i = ALPHA.indexOf(c); return i < 0 ? c : ALPHA[(i + k) % ALPHA.length]; }).join('');
  const DIRS = { 0: 'norður', 45: 'norðaustur', 90: 'austur', 135: 'suðaustur', 180: 'suður', 225: 'suðvestur', 270: 'vestur', 315: 'norðvestur' };
  const dir = DIRS[Math.round(S.compassDeg / 45) * 45 % 360] || S.compassDeg + '°';
  const col = (D.colors[S.treeColor] || {}).name || S.treeColor;
  const MC = { A:'·—',B:'—···',D:'—··',E:'·',F:'··—·',G:'——·',H:'····',I:'··',J:'·———',K:'—·—',L:'·—··',M:'——',N:'—·',O:'———',P:'·——·',R:'·—·',S:'···',T:'—',U:'··—',V:'···—',X:'—··—',Y:'—·——' };
  const MO = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('Ö','O').split('').map(c => `${c} ${MC[c]||''}`).join(' &nbsp; ');
  const riddle = D.riddles[+L[2]];
  const row = (n, place, task, ans) => `<tr><td class="n">${n}</td><td class="s">${place}</td><td>${task}</td><td>${ans}</td></tr>`;
  const head = `<colgroup><col class="n"><col class="s"><col><col class="a"></colgroup><tr><th>#</th><th>Staður</th><th>Hvað gera þau</th><th>Lausn</th></tr>`;

  const troll = [
    row(1, '<b>Forstofan</b>aðalhúsið', 'Leita að því sem Drumbur týndi. Velja rétta mynd í appinu.', '<span class="ans">Sokkur</span> 🧦 (risastór ullarsokkur í forstofunni)'),
    row(2, '<b>Gestahúsið</b>', 'Slökkva ljósin, finna glóandi tröllasteina (ljósastafi) og telja þá.', `<span class="ans big">${S.glowCount}</span> ljósastafir`),
    row(3, '<b>Trén</b>hjá pottinum', 'Lýsa upp í greinarnar og segja hvernig tröllaljósin eru á litinn.', `<span class="ans">${col}</span>`),
    row(4, '<b>Álfahúsið</b>', 'Leikur: lýsa með fingri á skjáinn og finna 4 álfa. Svo sækja gjöfina á bak við álfahúsið.', '<span class="ans">Armband</span> 📿 (glóarmbönd á bak við álfahúsið)'),
    row(5, '<b>Rústin</b>steinahrúgan', 'Leikur: báðir halda fingri á skjánum í einu og „velta steininum“. Þá opnast tröllaratsjáin: ganga hægt um rústina, pípið hraðar nær. Finna stein með andliti.', '<span class="ans">Steinn</span> 🪨 Steini litli. Ratsjáin virkar bara ef staðsetningin var skráð í HQ. Annars segir fullorðinn „heitt/kalt“.'),
    row(6, '<b>Bæli Drumbs</b>hjá stóra húsinu', 'Læðast hljóðlega (hljóðmælir í símanum). Við bælið: hrista símann = töfraljós. Taka það sem Drumbur heldur á.', '<span class="ans">Lykill</span> 🔑 lykill Drumbs (lás <b>D</b>)'),
    row(7, '<b>Heiti potturinn</b>', 'Bíða við kistuna og verja hana: lýsa á litlu tröllin á skjánum þar til stelpurnar koma.', 'Opna lás D þegar báðir lyklarnir eru komnir.')
  ];
  const runir = [
    row(1, '<b>Bréf Ketils</b>í appinu', 'Lesa rúnaskilaboð í appinu með rúnalyklinum og skrifa svarið.', '<span class="ans">SPEGILLINN Í LITLA HÚSINU</span> (nóg að skrifa „spegil“)'),
    row(2, '<b>Gestahúsið</b>spegillinn', 'Miði 1 hangir á speglinum, rúnir í spegilskrift. Halda miðanum upp að speglinum og lesa.', `FYRSTA TALAN ER ${W(L[0])} → <span class="ans big">${L[0]}</span>`),
    row(3, '<b>Rústin</b>→ krukkan', `Áttaviti: ${S.compassSteps} skref í ${dir} frá rústinni að krukku merktri ᛝ. Miði 2 á dulmáli. Hjól Ketils: ytra A yfir innra D, lesa ytri stafinn.`, `<span class="code">${CAESAR('ÖNNUR TALAN ER ' + W(L[1]), 3)}</span><br>= ÖNNUR TALAN ER ${W(L[1])} → <span class="ans big">${L[1]}</span>`),
    row(4, '<b>Kjarrið</b>vestast', 'Tína ALLA 11 glóandi miðana. Leikur í pörum: önnur sér rúnirnar, hin ýtir á takkana. Svo henda miðum með ᛞ og raða miðum með ᛝ í orð.', '7 réttir (ᛝ): H R I N G U R<br>4 gildrur (ᛞ): S T L Á<br><span class="ans">HRINGUR</span>'),
    row(5, '<b>Ljósahringurinn</b>í móunum', `Finna flöskuskeyti í miðjum hringnum (miði 3). Leikur: herma eftir röð rúnasteina (5 tónar). Svara gátunni: „${riddle}“`, `<span class="ans big">${L[2]}</span>`),
    row(6, '<b>Útsýnispallurinn</b>', 'Horfa á gluggann á húsinu. Ljósvitinn blikkar Morse eftir RAUÐA ljósið. Stutt = punktur, langt = strik.', `<span class="ans">${W(L[3])}</span> → <span class="ans big">${L[3]}</span><br>${MO(W(L[3]))}<br>Sjá „Ljósvitinn“ neðst.`),
    row(7, '<b>Rúnalásinn</b>á pallinum', 'Leikur: rúlla silfurpeningi í gegnum völundarhús. Slá svo inn kóðann. Ketill segir hvar lykillinn er.', `Kóði <span class="ans big">${L.join(' ')}</span><br>Lykill Ketils er ${S.girlsKeyPlace} (lás <b>ᛝ</b>)`),
    row(8, '<b>Heiti potturinn</b>', 'Koma með lykil Ketils. Bíða eftir strákunum ef þeir eru ekki komnir.', 'Opna lás ᛝ þegar báðir lyklarnir eru komnir.')
  ];

  document.getElementById('p').innerHTML = `
    <h1>Silfur Ketils hængs · Svarblað <small>Stilla · laugardaginn 14. nóvember 2026 · kl. 16</small></h1>
    <div class="top">
      <div><b>Röðin:</b> stelpurnar byrja fyrst. Strákarnir leggja af stað þegar stelpurnar eru komnar að rústinni.</div>
      <div><b>Rúnakóðinn:</b> <span class="code">${L.join(' ')}</span> (spegill · krukka · gáta · Morse)</div>
      <div><b>Höfuðstöðvar:</b> appið → 🔒 Höfuðstöðvar, lykilorð <b>${D.hqPin}</b>. Þar sést hvar liðin eru og hægt er að færa lið á aðra stöð.</div>
      <div><b>Hvítlaukur:</b> hvert barn fær hvítlauksrif á bandi um hálsinn í upphafi. Draugarnir í sögunni flýja þegar krakkarnir halda honum hátt upp og telja upp að þremur.</div>
      <div><b>Fastir?</b> Hver stöð er með vísbendingarhnapp. Fullorðinn má alltaf segja svarið og ýta áfram.</div>
    </div>
    <h2>Tröllaspæjararnir <span>Jóhann og Hólmar · 6–7 ára · rekja slóð Drumbs og ná lyklinum hans</span></h2>
    <table>${head}${troll.join('')}</table>
    <h2 class="r">Rúnameistararnir <span>Katrín og Aría · 10 ára · safna rúnakóðanum og finna lykil Ketils</span></h2>
    <table>${head}${runir.join('')}</table>
    <div class="mo"><b>Ljósvitinn (Morse á útsýnispallinum):</b>
      <ol>
        <li><b>Fyrir leik:</b> á spjaldtölvu eða aukasíma skaltu opna síðuna og fara í 🔒 Höfuðstöðvar → flipann <b>Ljósviti</b> → <b>„Þetta tæki er ljósvitinn“</b>. Skjárinn verður svartur. Settu birtuna í botn, slökktu á sjálfvirkri skjálæsingu, tengdu hleðslutæki og stilltu tækinu upp í glugga sem sést frá pallinum. Efst á að standa „tengdur ✓“.</li>
        <li><b>Í leiknum fer hann sjálfur í gang</b> þegar stelpurnar ýta á „Við erum komin“ á pallinum: <b>rautt</b> í 3,5 sek og svo ${W(L[3])} aftur og aftur. Hann slokknar sjálfur þegar þær svara rétt. Stelpurnar geta ýtt á „💡 Ljósið aftur“ til að byrja upp á nýtt.</li>
        <li><b>Handvirkt:</b> á símanum þínum skaltu fara í Höfuðstöðvar → Ljósviti → <b>„Þetta tæki er fjarstýringin“</b>. Þar eru takkarnir ▶ Byrja Morse, ■ Myrkur og ☀ Hvítt í 15 sek (til að miða tækinu). Varaleið: haltu fingri á skjá ljósvitans í 2 sek til að kveikja eða slökkva. Ef ekkert netsamband næst blikkar hann sjálfur eftir 25 sek. Tvísmelltu á skjáinn til að hætta.</li>
      </ol></div>
    <div class="fin"><b>Lokin við pottinn:</b> kistan er undir teppi með tveimur lásum, <b>D</b> (lykill Drumbs, strákarnir) og <b>ᛝ</b> (lykill Ketils, stelpurnar). Liðin opna saman. Í kistunni er silfrið og bréf frá Drumbi. Sögumaðurinn les bréfið og krakkarnir skilja sokkinn hans eftir hjá pottinum. Viðurkenningin er afhent á eftir.</div>
    <div class="foot">Svörin á þessu blaði fylgja stillingunum í Höfuðstöðvum þegar blaðið er prentað. Ef kóða, lit eða fjölda er breytt þarf að prenta aftur.</div>`;
})();
</script>
</body>
</html>
